name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configure private feed
        run: dotnet nuget update source github-auxil --username USERNAME --password ${{ secrets.AUXIL_PACKAGES_TOKEN }} --store-password-in-clear-text

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  aot-smoke:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Configure private feed
        run: dotnet nuget update source github-auxil --username USERNAME --password ${{ secrets.AUXIL_PACKAGES_TOKEN }} --store-password-in-clear-text

      - name: Publish Native AOT
        run: pwsh -NoProfile -File scripts/build-artifact.ps1

      - name: Smoke run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./dist/Catalyst.exe --version
          if ($LASTEXITCODE -ne 0) { throw '--version failed' }
          $report = ./dist/Catalyst.exe gen openapi --source Catalyst.Tests/Fixtures/Specs/minimal.json --json | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $report.success) { throw 'gen openapi failed' }

  release-binaries:
    needs: [build-and-test, aot-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Configure private feed
        run: dotnet nuget update source github-auxil --username USERNAME --password ${{ secrets.AUXIL_PACKAGES_TOKEN }} --store-password-in-clear-text

      - name: Read version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish win-x64 Native AOT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $env:PATH = "$installer;$env:PATH"
          dotnet publish Catalyst.csproj --configuration Release --runtime win-x64 -p:PublishAot=true -p:DebugType=None -p:DebugSymbols=false -p:Version=${{ steps.version.outputs.version }} --output ./publish
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p dist
          mv ./publish/Catalyst.exe dist/catalyst-windows-amd64.exe
          sha256sum dist/catalyst-windows-amd64.exe > dist/catalyst-windows-amd64.exe.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
